name: OpenRouter TTS test

# Manual one-off: voices a short two-host excerpt with several OpenRouter speech models
# (scripts/tts_test.py) and keeps the MP3s and results.md as the `tts-test` artifact.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only run variants whose name contains this (e.g. gemini)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install
        run: pip install httpx
      - name: Run test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: 1
          ONLY: ${{ inputs.only }}
        run: python scripts/tts_test.py tts-test "$ONLY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-test
          path: tts-test/
