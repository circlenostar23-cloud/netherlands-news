name: Daily episode

on:
  # Started daily at 04:13 Europe/Amsterdam by cron-job.org (a 06:00 backup
  # job is planned but not set up yet; see README), which
  # POSTs to this workflow's dispatches API with a fine-grained PAT (Actions
  # read/write on this repo only). GitHub's own `schedule` trigger never fired
  # for this repo, so it isn't used. This replaces daily.yml, whose runs got
  # stuck in the queue on 2026-09-29 and couldn't be cancelled.
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if today's episode is already published"
        type: boolean
        default: false
      no_email:
        description: "Skip email"
        type: boolean
        default: false
      feed_only:
        description: "Only rebuild the feed and redeploy Pages (no new episode)"
        type: boolean
        default: false

permissions:
  actions: read     # download artifacts from earlier runs
  contents: write   # create releases
  pages: write
  id-token: write

concurrency:
  group: episode
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          FORCE: ${{ inputs.force || inputs.feed_only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A backup trigger (and any manual rerun) skips once today's
          # episode is out, so a second trigger never spends Gemini TTS quota.
          day=$(TZ=Europe/Amsterdam date +%F)
          if [ "$FORCE" = true ]; then
            run=true
          elif gh release view "ep-$day" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ep-$day is already published"
            run=false
          else
            run=true
          fi
          echo "day $day, force '$FORCE' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  episode:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FEED_SECRET_PATH: ${{ secrets.FEED_SECRET_PATH }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"  # show pipeline progress in the log as it happens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code

      # Stages are cached per day in data/<date>/, so restoring a failed run's
      # working files lets a rerun skip finished stages and audio chunks.
      - name: Resume from today's last failed run
        if: ${{ !inputs.feed_only }}
        run: |
          day=$(TZ=Europe/Amsterdam date +%F)
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow episode.yml -L 10 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.conclusion == \"failure\" or .conclusion == \"cancelled\"))][0].databaseId // empty")
          [ -n "$prev" ] || { echo "No earlier failed run"; exit 0; }
          gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n episode-data -D restored || { echo "Run $prev has no working files"; exit 0; }
          if [ -d "restored/$day" ]; then
            mkdir -p data && mv "restored/$day" data/
            echo "Resuming $day from run $prev:"; ls -R "data/$day"
          else
            echo "Run $prev was for a different day; starting fresh"
          fi

      - name: Run pipeline
        if: ${{ !inputs.feed_only }}
        run: python -m nlnews run ${{ inputs.no_email && '--no-email' || '' }}

      - name: Rebuild feed only
        if: ${{ inputs.feed_only }}
        run: python -m nlnews feed

      - name: Keep working files for debugging
        if: ${{ always() && !inputs.feed_only }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-data
          path: data/
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
