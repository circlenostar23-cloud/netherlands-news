name: Daily episode

on:
  schedule:
    # Target 04:13 Amsterdam year-round. Cron is UTC-only, so both slots are
    # scheduled and the gate job keeps whichever matches the current offset:
    # 02:13 UTC in summer (CEST, +02:00), 03:13 UTC in winter (CET, +01:00).
    - cron: "13 2 * * *"
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      no_email:
        description: "Skip email"
        type: boolean
        default: false

permissions:
  contents: write   # create releases
  pages: write
  id-token: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          offset=$(TZ=Europe/Amsterdam date +%z)
          case "${{ github.event.schedule }}" in
            "13 2 * * *") [ "$offset" = "+0200" ] && run=true || run=false ;;
            "13 3 * * *") [ "$offset" = "+0100" ] && run=true || run=false ;;
            *) run=true ;;  # manual dispatch
          esac
          echo "Amsterdam offset $offset, schedule '${{ github.event.schedule }}' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  episode:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FEED_SECRET_PATH: ${{ secrets.FEED_SECRET_PATH }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        run: python -m nlnews run ${{ inputs.no_email && '--no-email' || '' }}

      - name: Keep working files for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-data
          path: data/
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
