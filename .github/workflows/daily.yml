name: Daily episode

on:
  schedule:
    # Target 04:13 Amsterdam year-round. Cron is UTC-only, so both slots are
    # scheduled and the gate job keeps whichever matches the current offset:
    # 02:13 UTC in summer (CEST, +02:00), 03:13 UTC in winter (CET, +01:00).
    - cron: "13 2 * * *"
    - cron: "13 3 * * *"
    # Watchdog: GitHub sometimes drops scheduled runs, so check again ~2h
    # later and build the episode only if today's release is still missing.
    - cron: "7 4 * * *"
  # Also started by an external cron via the workflow_dispatch API, because
  # GitHub's scheduler has never fired for this repo (see ITERATIONS.md).
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if today's episode is already published"
        type: boolean
        default: false
      no_email:
        description: "Skip email"
        type: boolean
        default: false
      feed_only:
        description: "Only rebuild the feed and redeploy Pages (no new episode)"
        type: boolean
        default: false

permissions:
  actions: read     # download artifacts from earlier runs
  contents: write   # create releases
  pages: write
  id-token: write

concurrency:
  group: daily-episode-v2  # renamed: runs queued behind a stuck lock on 2026-09-29
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force || inputs.feed_only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Several triggers can fire on the same day (GitHub cron, the external
          # cron, the watchdog), so every one skips once today's episode is out.
          # This keeps a duplicate trigger from spending Gemini TTS quota.
          offset=$(TZ=Europe/Amsterdam date +%z)
          day=$(TZ=Europe/Amsterdam date +%F)
          if [ "$FORCE" = true ]; then
            run=true
          elif gh release view "ep-$day" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ep-$day is already published"
            run=false
          else
            case "$SCHEDULE" in
              "13 2 * * *") [ "$offset" = "+0200" ] && run=true || run=false ;;
              "13 3 * * *") [ "$offset" = "+0100" ] && run=true || run=false ;;
              *) run=true ;;  # watchdog, manual or external dispatch
            esac
          fi
          echo "Amsterdam offset $offset, schedule '$SCHEDULE', force '$FORCE' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  episode:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FEED_SECRET_PATH: ${{ secrets.FEED_SECRET_PATH }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code

      # Stages are cached per day in data/<date>/, so restoring a failed run's
      # working files lets a rerun skip finished stages and audio chunks.
      - name: Resume from today's last failed run
        if: ${{ !inputs.feed_only }}
        run: |
          day=$(TZ=Europe/Amsterdam date +%F)
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml -L 10 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.conclusion == \"failure\" or .conclusion == \"cancelled\"))][0].databaseId // empty")
          [ -n "$prev" ] || { echo "No earlier failed run"; exit 0; }
          gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n episode-data -D restored || { echo "Run $prev has no working files"; exit 0; }
          if [ -d "restored/$day" ]; then
            mkdir -p data && mv "restored/$day" data/
            echo "Resuming $day from run $prev:"; ls -R "data/$day"
          else
            echo "Run $prev was for a different day; starting fresh"
          fi

      - name: Run pipeline
        if: ${{ !inputs.feed_only }}
        run: python -m nlnews run ${{ inputs.no_email && '--no-email' || '' }}

      - name: Rebuild feed only
        if: ${{ inputs.feed_only }}
        run: python -m nlnews feed

      - name: Keep working files for debugging
        if: ${{ always() && !inputs.feed_only }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-data
          path: data/
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
